[pytest]
testpaths = scenarios
# -ra lists every skip with its reason: a skipped scenario is a gap in what
# this host could check, and should be visible.
addopts = -ra --strict-markers -p no:cacheprovider
# Every scenario has its own, shorter, waits; this is the backstop.
timeout = 600
markers =
    slow: moves a lot of data or waits out long timeouts
    plan(id): the TEST_PLAN.md scenario ID(s) this test implements
