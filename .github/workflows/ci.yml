name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  format:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  lint:
    name: clippy (pedantic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings

  test:
    name: test (${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # `stable` catches new lints; the pinned version is the MSRV this
        # crate advertises, and `--locked` is what makes that claim real.
        rust: [stable, "1.88"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
      # The end-to-end suite drives a real `rsync -e qsh` transfer when rsync
      # is present, and silently skips that test when it is not.
      - name: Install rsync
        run: sudo apt-get update && sudo apt-get install -y rsync
      - run: cargo build --locked --all-targets
      - run: cargo test --locked --all-features

  test-as-root:
    name: privilege drop (root)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install rsync
        run: sudo apt-get update && sudo apt-get install -y rsync
      - run: cargo build --locked --tests
      # As an unprivileged user the server never switches account, so the
      # initgroups/setgid/setuid path is simply not reached. Running the suite
      # as root is what exercises it.
      - name: Run the end-to-end suite as root
        run: sudo -E env "PATH=$PATH" cargo test --locked --test e2e

  msrv-matches-lockfile:
    name: MSRV is honest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rust-src
      # `cargo +<msrv> build --locked` above proves the graph resolves, but
      # this catches a dependency bump raising the requirement before it
      # reaches the build.
      - name: Verify the declared rust-version against the dependency graph
        run: |
          set -euo pipefail
          declared=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)
          echo "declared MSRV: $declared"
          highest=$(cargo metadata --locked --format-version 1 \
            | python3 -c '
import json,sys
meta = json.load(sys.stdin)
best = (0, 0, 0)
name = ""
# Only dependencies matter here; this crate's own claim is what we check.
root = {"qsh"}
for pkg in meta["packages"]:
    rv = pkg.get("rust_version")
    if not rv or pkg["name"] in root:
        continue
    parts = tuple(int(p) for p in (rv.split(".") + ["0", "0"])[:3])
    if parts > best:
        best, name = parts, pkg["name"]
print("%d.%d.%d %s" % (best + (name,)))')
          echo "highest dependency requirement: $highest"
          req=${highest%% *}
          python3 - "$declared" "$req" <<'PY'
import sys
def parse(v):
    return tuple(int(p) for p in (v.split(".") + ["0", "0"])[:3])
declared, required = parse(sys.argv[1]), parse(sys.argv[2])
if declared < required:
    sys.exit(
        f"Cargo.toml declares rust-version {sys.argv[1]} but the locked "
        f"dependency graph needs {sys.argv[2]}"
    )
print("MSRV claim is consistent with Cargo.lock")
PY
