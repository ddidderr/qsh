name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# Pin workflow action code and the container image; update them deliberately.
# Keep the actionlint image in sync with `just audit-ci`.
jobs:
  # Single source of truth for the MSRV, so the matrix below and Cargo.toml
  # cannot drift apart.
  msrv:
    name: resolve MSRV
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: read
        run: |
          version=$(sed -n 's/^rust-version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -n1)
          test -n "$version" || { echo "Cargo.toml has no rust-version" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "MSRV is $version"

  # A workflow that does not parse runs nothing at all and reports no failure,
  # which is exactly how the first version of this file went unnoticed.
  workflow-lint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Lint the workflow files
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color

  format:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  lint:
    name: clippy (pedantic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings

  test:
    name: test (${{ matrix.rust }})
    needs: msrv
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # `stable` catches new lints; the pinned version is the MSRV this
        # crate advertises, and `--locked` is what makes that claim real.
        rust: [stable, "${{ needs.msrv.outputs.version }}"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # The end-to-end suite drives a real `rsync -e qsh` transfer when rsync
      # is present, and skips that test when it is not.
      - name: Install rsync
        run: sudo apt-get update && sudo apt-get install -y rsync
      - run: cargo build --locked --all-targets
      - run: cargo test --locked --all-features

  test-as-root:
    name: privilege drop (root)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install rsync
        run: sudo apt-get update && sudo apt-get install -y rsync
      - run: cargo build --locked --tests
      # As an unprivileged user the server never switches account, so the
      # setgroups/setgid/setuid path is simply not reached. Running the suite
      # as root is what exercises it.
      - name: Run the end-to-end suite as root
        run: sudo -E env "PATH=$PATH" cargo test --locked --test e2e
      - name: Check mixed real, effective and saved credentials as root
        run: sudo -E env "PATH=$PATH" cargo test --locked --lib child::tests::mixed_credentials_cannot_reach_remote_exec
      - name: Check service capabilities are cleared as root
        run: sudo -E env "PATH=$PATH" cargo test --locked --lib child::tests::sessions_do_not_inherit_service_capabilities
      # A plain hosted-runner shell may lack cgroup delegation. Run this one
      # test in a transient root scope that delegates a cgroup v2 subtree and
      # require the real success path, rather than accepting a fail-closed-only
      # test as proof that cleanup works.
      - name: Restricted session cgroup integration
        run: |
          sudo -E env "PATH=$PATH" systemd-run --scope --quiet --collect \
            --same-dir -p Delegate=yes \
            env QSH_REQUIRE_DELEGATED_CGROUP=1 cargo test --locked --test e2e \
            cgroup_policy_kills_detached_descendants_or_fails_before_exec -- --exact --nocapture

  msrv-matches-lockfile:
    name: MSRV is honest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # Building on the MSRV toolchain proves the graph builds today; this
      # catches a dependency bump raising the requirement.
      - name: Verify the declared rust-version against the dependency graph
        run: python3 ci/check-msrv.py

  audit:
    name: dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2
        with:
          tool: cargo-audit@0.22.2
      # Vulnerabilities always fail. Informational advisories — unmaintained,
      # unsound, yanked, notice — only fail because of `--deny warnings`, so a
      # crate going unmaintained is caught here rather than in a review round.
      # Every accepted advisory must be listed with a reason.
      - name: cargo audit
        run: cargo audit --deny warnings
