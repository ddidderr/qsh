name: e2e

# The multi-host end-to-end suite (e2e/): five containers, qsh-server under
# systemd, a network simulator in between. See e2e/README.md.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Cheap and first: the plan and the scenarios must agree.
  plan:
    name: test plan matches the scenarios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: e2e/run plan

  multihost:
    name: multi-host scenarios
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # The slow scenarios (a gigabyte each way, outages under the default
      # timeouts) add little on a pull request; main runs them.
      - name: Run the suite
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            e2e/run test -m "not slow"
          else
            e2e/run test
          fi
      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-logs
          path: |
            target/e2e/junit.xml
            target/e2e/artifacts/
          if-no-files-found: ignore
