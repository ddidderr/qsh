[package]
name = "qsh"
version = "1.0.0"
edition = "2021"
rust-version = "1.88"
description = "A minimal SSH replacement over QUIC: remote shell, remote exec and rsync transport"
license = "MIT"
repository = "https://github.com/ddidderr/qsh"
readme = "README.md"
keywords = ["quic", "ssh", "remote", "shell", "rsync"]
categories = ["command-line-utilities", "network-programming"]

[[bin]]
name = "qsh"
path = "src/bin/qsh.rs"

[[bin]]
name = "qsh-server"
path = "src/bin/qsh-server.rs"

[lints.rust]
# Every `unsafe` block must justify itself with an explicit allow. The handful
# that remain are the Unix primitives with no safe equivalent: PTY ioctls, raw
# fd reads/writes, kill(2), and the pre-exec hook that drops privileges.
unsafe_code = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# A remote-shell daemon must never abort a session because of a panic path we
# were too lazy to handle.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
integer_division = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
# Style choices that fight the way this crate is laid out.
module_name_repetitions = "allow"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
libc = "0.2"
nix = { version = "0.31", features = ["term", "process", "fs", "user", "signal", "poll", "hostname"] }
# `default-features = false` keeps `heapless` out of the graph: it is only
# needed for no_std targets and drags in the unmaintained `atomic-polyfill`.
postcard = { version = "1", default-features = false, features = ["use-std"] }
quinn = { version = "0.11", default-features = false, features = [
    "log",
    "runtime-tokio",
    "rustls-ring",
    "bloom",
] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "io-std",
    "process",
    "signal",
    "sync",
    "time",
] }
time = "0.3"
toml = "1"
x509-parser = "0.18"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
